@for (alert of alertService.visibleAlerts(); track alert.id) {
  <adb-alert
    [attr.variant]="alert.variant"
    [attr.heading]="alert.heading ?? null"
    [attr.closable]="alert.closable ? '' : null"
    (adb-close)="alertService.dismiss(alert.id)"
  >
    {{ alert.message }}
    @if (alert.startDisplayDate || alert.endDisplayDate) {
      <div class="alert-date-range">{{ formatDateRange(alert.startDisplayDate, alert.endDisplayDate) }}</div>
    }
  </adb-alert>
}
