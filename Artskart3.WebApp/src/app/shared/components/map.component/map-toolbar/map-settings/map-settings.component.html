<div class="map-toolbar-menu-container">
  <adb-icon-button
    [attr.variant]="isOpen() ? 'primary' : 'secondary'"
    (click)="toggleMapSettings()"
    [attr.aria-label]="'mapToolbar.settingsAriaLabel' | translate"
    [attr.aria-pressed]="isOpen()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960" fill="none" aria-hidden="true">
      <path
        d="M440-120v-240h80v80h320v80H520v80h-80Zm-320-80v-80h240v80H120Zm160-160v-80H120v-80h160v-80h80v240h-80Zm160-80v-80h400v80H440Zm160-160v-240h80v80h160v80H680v80h-80Zm-480-80v-80h400v80H120Z"
        fill="currentColor"
      />
    </svg>
  </adb-icon-button>
  @if (isOpen()) {
    <div class="map-toolbar-menu-dropdown" role="group" [attr.aria-label]="'mapToolbar.settingsAriaLabel' | translate">
      <adb-switch
        [checked]="clusteringEnabled()"
        [attr.description]="'mapToolbar.clusteringDescription' | translate"
        (change)="onClusteringChange($event)"
      >
        {{ 'mapToolbar.clustering' | translate }}
      </adb-switch>
    </div>
  }
</div>
