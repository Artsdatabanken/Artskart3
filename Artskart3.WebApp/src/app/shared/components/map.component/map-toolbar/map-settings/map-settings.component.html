<div class="map-toolbar-menu-container" appMapControlTooltip>
  <adb-icon-button
    [attr.variant]="isOpen() ? 'primary' : 'secondary'"
    (click)="toggleMapSettings()"
    [attr.aria-label]="'mapToolbar.settingsAriaLabel' | translate"
    [attr.aria-pressed]="isOpen()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true"
  >
    <adb-icon name="tune" aria-hidden="true" />
  </adb-icon-button>
  <!-- aria-hidden: aria-describedby cannot reach the <button> in adb-icon-button's shadow DOM -->
  <span class="map-control-tooltip" aria-hidden="true">{{ 'mapToolbar.settingsTooltip' | translate }}</span>
  @if (isOpen()) {
    <div class="map-toolbar-menu-dropdown" role="group" [attr.aria-label]="'mapToolbar.settingsAriaLabel' | translate">
      <div class="clustering-setting">
        <adb-switch
          [checked]="clusteringEnabled()"
          [disabled]="clusteringLock() !== null"
          [attr.description]="'mapToolbar.clusteringDescription' | translate"
          (change)="onClusteringChange($event)"
        >
          {{ 'mapToolbar.clustering' | translate }}
        </adb-switch>
        @if (clusteringLock() === 'tooManyLocations') {
          <p class="clustering-locked-tooltip" role="note">
            {{ 'mapToolbar.clusteringLocked' | translate: { max: (maxLocations | formatNumber: translate.currentLang) } }}
          </p>
        }
      </div>
    </div>
  }
</div>
