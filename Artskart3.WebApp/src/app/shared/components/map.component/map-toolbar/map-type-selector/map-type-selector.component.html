<div class="map-toolbar-menu-container" appMapControlTooltip>
  <adb-icon-button
    #toggleButton
    [attr.variant]="isOpen ? 'primary' : 'secondary'"
    (click)="toggleMapTypes()"
    [attr.aria-label]="getToggleButtonAriaLabel()"
    [attr.aria-pressed]="isOpen"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="true"
  >
    <span class="sr-only">{{ getToggleButtonAriaLabel() }}</span>
    <adb-icon name="map" aria-hidden="true" />
  </adb-icon-button>
  <!-- aria-hidden: aria-describedby cannot reach the <button> in adb-icon-button's shadow DOM -->
  <span class="map-control-tooltip" aria-hidden="true">{{ 'mapToolbar.mapTypeTooltip' | translate }}</span>

  @if (isOpen) {
    <div class="map-toolbar-menu-dropdown" aria-labelledby="map-types-heading">
      <div id="map-types-heading" class="map-toolbar-menu-header adb-heading-2xsm" role="heading" aria-level="2">{{ 'mapToolbar.mapTypeHeading' | translate }}</div>
      <adb-radio-group
        name="mapType"
        [attr.value]="selectedLayerId"
        (change)="onRadioGroupChange($event)"
      >
        @for (option of mapTypeOptions; track option.layerId) {
          <adb-radio
            [attr.value]="option.layerId"
            [attr.checked]="selectedLayerId === option.layerId ? '' : null"
            [attr.description]="option.description ? (option.description | translate) : null"
          >{{ option.label | translate }}</adb-radio>
        }
      </adb-radio-group>
    </div>
  }
</div>
