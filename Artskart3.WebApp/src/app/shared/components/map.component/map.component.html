<div class="map-container">
  <app-map-toolbar (iconClick)="onIconClick($event)"></app-map-toolbar>
  <div #mapEl class="map"></div>
  @if (showObservationList()) {
    <app-observation-list [observationList]="observationList()" [clickCoordinates]="clickCoordinates()"/>
  }
  <app-loading-indicator
    [active]="isLoadingAreaData()"
    [label]="'mapToolbar.loadingObservationsLabel' | translate"
  ></app-loading-indicator>
</div>
