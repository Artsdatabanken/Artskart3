<div class="map-container">
  <app-map-toolbar
    (iconClick)="onIconClick($event)"
    (mapToolbarMenuItemChange)="onMapToolbarMenuItemChange($event)"
  ></app-map-toolbar>
  <div #mapEl class="map"></div>
  @if (showObservationList() && observationSelection(); as selection) {
    <app-observation-list [observationList]="observationList()" [selection]="selection"
      [requestState]="observationRequestState()" (retry)="retryObservations()"/>
  }
  <app-loading-indicator
    [active]="isLoadingAreaData()"
    [label]="'mapToolbar.loadingObservationsLabel' | translate"
  ></app-loading-indicator>
</div>
