<div class="map-container">
  <app-map-toolbar
    [(clusteringEnabled)]="clusteringEnabled"
    [clusteringLock]="clusteringLock()"
    (iconClick)="onIconClick($event)"
    (mapToolbarMenuItemChange)="onMapToolbarMenuItemChange($event)"
  ></app-map-toolbar>
  <div #mapEl class="map"></div>
  <app-observation-panel
    [observations]="observationList()"
    [selection]="showObservationList() ? observationSelection() : null"
    [requestState]="observationRequestState()"
    (retry)="retryObservations()"
    (activePoint)="highlightObservation($event)"
    (detailsOpened)="detailsOpened.emit()"
    (closed)="closeObservationList(false)"
  />
  <app-loading-indicator [active]="isLoadingAreaData()" [label]="'mapToolbar.loadingObservationsLabel' | translate"></app-loading-indicator>
</div>
