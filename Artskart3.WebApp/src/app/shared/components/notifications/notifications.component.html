@for (notification of visibleNotifications(); track notification.id) {
  <adb-alert
    [attr.variant]="variant(notification)"
    [attr.heading]="notification.heading"
    [attr.closable]="notification.canClose ?? true ? '' : null"
    (adb-close)="dismiss(notification)"
  >
    @if (notification.eventStart || notification.eventEnd) {
      <div class="alert-date-range">{{ notification.eventStart | dateRange: notification.eventEnd : translate.currentLang }}</div>
    }
    @if (notification.description) {
      {{ notification.description }}
    }
  </adb-alert>
}
