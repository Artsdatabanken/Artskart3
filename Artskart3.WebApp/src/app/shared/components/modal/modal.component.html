@if (open()) {
<div
  class="modal-backdrop"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
>
  <div
    #dialog
    class="modal-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
  >
    <div class="modal-header">
      <h2 [id]="titleId" class="modal-title">{{ title() }}</h2>
      @if (variant() === 'info') {
      <button
        type="button"
        class="modal-close-btn"
        [attr.aria-label]="'common.close' | translate"
        (click)="emitCancel()"
      >
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M5.33334 15.8334L4.16667 14.6667L8.83334 10L4.16667 5.33337L5.33334 4.16671L10 8.83337L14.6667 4.16671L15.8333 5.33337L11.1667 10L15.8333 14.6667L14.6667 15.8334L10 11.1667L5.33334 15.8334Z" fill="currentColor"/>
        </svg>
      </button>
      }
    </div>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>

    <div class="modal-footer">
      @if (variant() === 'prompt') {
      <adb-button variant="tertiary" size="md" (click)="emitCancel()">
        {{ cancelLabel() }}
      </adb-button>
      }
      <adb-button
        variant="primary"
        size="md"
        [attr.disabled]="confirmDisabled() || loading() ? '' : null"
        (click)="emitConfirm()"
      >
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        {{ confirmLabel() }}
      </adb-button>
    </div>
  </div>
</div>
}
