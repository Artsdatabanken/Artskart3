@if (open()) {
<div
  class="modal-backdrop"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
>
  <div
    #dialog
    class="modal-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
  >
    <div class="modal-header">
      <h2 [id]="titleId" class="modal-title">{{ title() }}</h2>
      @if (variant() === 'info') {
      <button
        type="button"
        class="modal-close-btn"
        [attr.aria-label]="'common.close' | translate"
        (click)="emitCancel()"
      >
        <adb-icon class="modal-close-icon" name="close" aria-hidden="true" />
      </button>
      }
    </div>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>

    <div class="modal-footer">
      @if (variant() === 'prompt') {
      <adb-button [attr.variant]="cancelVariant()" size="md" (click)="emitCancel()">
        {{ cancelLabel() }}
      </adb-button>
      }
      <adb-button
        variant="primary"
        [attr.color]="confirmColor()"
        size="md"
        [attr.disabled]="confirmDisabled() || loading() ? '' : null"
        (click)="emitConfirm()"
      >
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        {{ confirmLabel() }}
      </adb-button>
    </div>
  </div>
</div>
}
