@if (chips().length > 0) {
  <div class="filter-chips">
    @for (chip of chips(); track chip.id) {
      <span #chipElement class="filter-chip">
        <button #chipButton type="button" class="filter-chip-open" (click)="openFilter.emit(chip.section)">
          <span class="filter-chip-text">{{ chip.text }}</span>
          @if (chip.suffix) {
            <span class="filter-chip-suffix">{{ chip.suffix }}</span>
          }
        </button>
        <app-tooltip [anchor]="chipButton" [alignTo]="chipElement">{{ chip.details }}</app-tooltip>
        <adb-icon-button size="sm" variant="tertiary" [attr.aria-label]="'sidebar.removeFilterAriaLabel' | translate: { filter: chip.label }" (click)="chip.clear()">
          <adb-icon name="close" />
        </adb-icon-button>
      </span>
    }
  </div>
}
