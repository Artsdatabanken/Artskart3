trigger:
  branches:
    include:
      - main
pr: 
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:

# ---------------------------
# Frontend (Angular) build
# ---------------------------

- task: NodeTool@0
  displayName: "Install Node.js"
  inputs:
    versionSpec: '24.x'

- script: |
    cd Artskart3.WebApp
    npm ci
  displayName: "Install Angular dependencies"

- script: |
    cd Artskart3.WebApp
    npm run lint
  displayName: "Lint Angular app"

- script: |
    cd Artskart3.WebApp
    npm run build -- --configuration production
  displayName: "Build Angular app"

- script: |
    cd Artskart3.WebApp
    npm test -- --watch=false
  displayName: "Run Angular tests"
  continueOnError: false

# Copy frontend build into backend wwwroot
- task: CopyFiles@2
  displayName: "Copy Angular dist to backend wwwroot"
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/Artskart3.WebApp/dist/artskart3.webapp/browser'
    Contents: '**'
    TargetFolder: '$(Build.SourcesDirectory)/Artskart3.Api/wwwroot'

# ---------------------------
# .NET restore/build/test
# ---------------------------

- task: UseDotNet@2
  displayName: "Install .NET SDK"
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: "Restore .NET dependencies"
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: "Build .NET solution"
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration Release'

- task: DotNetCoreCLI@2
  displayName: "Run .NET tests"
  inputs:
    command: 'test'
    projects: '**/*Tests*.csproj'
    arguments: '--configuration Release --no-build --settings coverage.runsettings --logger trx'
    publishTestResults: true

- task: DotNetCoreCLI@2
  displayName: "Publish .NET backend"
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'Artskart3.Api/Artskart3.Api.csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/backend'
    zipAfterPublish: true

- task: DotNetCoreCLI@2
  displayName: "Publish Workers"
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'Artskart3.Workers/Artskart3.Workers.csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/workers'
    zipAfterPublish: true

- publish: $(Build.ArtifactStagingDirectory)/backend
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  displayName: "Publish backend artifact"
  artifact: backend

- publish: $(Build.ArtifactStagingDirectory)/workers
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  displayName: "Publish workers artifact"
  artifact: workers
# ---------------------------
# EF-migrasjoner
#
# Migrasjonene bygges som en selvstendig kjoerbar (efbundle) og publiseres som
# artefakt. Deploy-steget kjoerer den mot databasen FOER appen deployeres:
#
#   ./efbundle --connection "$(ConnectionStrings-ArtskartIndex)"
#
# Byggpipelinen roerer ingen database — den lager bare kjoerbaren. Tilkoblingen
# under er en plassholder som kun brukes for aa konstruere DbContext ved bygg.
#
# VIKTIG for deploy-steget:
# - Sett Database:AutoMigrate = false naar bundtet tas i bruk, ellers kjoerer
#   API-et migrasjonene om igjen ved oppstart.
# - Sett timeoutInMinutes hoeyt nok. Migrasjonen BackfillAll fyller hele
#   datasettet og tar timer i et tomt miljoe. Feiler den paa tid, er det trygt:
#   den foerer fremdrift i dbo.BackfillProgress og fortsetter der den slapp ved
#   neste kjoering. Regn med flere forsoek foerste gang.
# ---------------------------

- script: |
    dotnet tool install --global dotnet-ef --version 10.0.7
    export PATH="$PATH:$HOME/.dotnet/tools"
    dotnet ef migrations bundle \
      --project Artskart3.Infrastructure \
      --startup-project Artskart3.Api \
      --context ArtskartDbContext \
      --configuration Release \
      --self-contained --target-runtime linux-x64 \
      --output $(Build.ArtifactStagingDirectory)/migrations/efbundle \
      --force
  env:
    ConnectionStrings__ArtskartIndex: 'Server=placeholder;Database=placeholder;'
  displayName: "Build EF migration bundle"

- publish: $(Build.ArtifactStagingDirectory)/migrations
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  displayName: "Publish migration bundle artifact"
  artifact: migrations
